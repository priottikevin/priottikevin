name: Metrics
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/metrics.yml"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: priottikevin
          template: classic
          config_timezone: Europe/Paris
          # Sections de base sans liste de dépôts ni flux d'activité (pas de noms de dépôts privés)
          base: header, repositories
          repositories_affiliations: owner
          # Calendrier d'activité sur l'année
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # Langages (dépôts privés inclus, seuls les pourcentages sont publiés)
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          # Habitudes de code (heures, jours, faits)
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          # Lignes ajoutées / supprimées, totaux uniquement
          plugin_lines: yes
          plugin_lines_sections: base
          # Achievements
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          # NE PAS activer : plugin_notable, plugin_projects, plugin_repositories,
          # plugin_activity, base "activity" -> ils peuvent exposer des noms de dépôts privés
